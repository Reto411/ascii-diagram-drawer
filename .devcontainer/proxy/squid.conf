# Squid egress proxy for the isolated pi devcontainer.
# Allow-list only: cargo/crates.io, docs.rs (crate API docs), rust-lang.org
# (std docs/book/reference), rustup — nothing else.
# The model server is NOT proxied: the agent reaches it directly via slirp's
# host-loopback alias (see .devcontainer/README.md, "Egress isolation").
#
# Runs with --network host; bound to loopback only so it is not exposed
# beyond this machine (same posture as the Unsloth server).

acl CONNECT method CONNECT
acl Safe_ports port 80 443
acl SSL_ports port 443

# Allowed hosts. Squid 6 dstdomain semantics (verified on squid 6.13):
# a bare name matches the apex exactly, a leading dot matches subdomains only —
# both forms are needed, and they must live in separate ACLs (one ACL mixing
# both forms is a config error).
acl allowed_apex dstdomain crates.io docs.rs rust-lang.org rustup.rs sh.rustup.rs
acl allowed_sub  dstdomain .crates.io .rust-lang.org

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow allowed_apex
http_access allow allowed_sub

# Everything else: denied.
http_access deny all

http_port 127.0.0.1:3128
