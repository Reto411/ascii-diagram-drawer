[package]
name = "gui-app"
description = "Presentation layer: eframe/egui app, native desktop + browser wasm (ADR 008)"
version.workspace = true
edition.workspace = true
license.workspace = true

# S-019: `cdylib` is the wasm entry (Trunk/wasm-bindgen); `rlib` keeps native tests linking.
[lib]
crate-type = ["cdylib", "rlib"]

# Allowed edges per §8.3: { ui-api, core-services, diagram-model } only — never the
# other context crates directly (ADR 009). eframe/egui land in S-012.
[dependencies]
core-services = { path = "../crates/core-services" }
diagram-model = { path = "../crates/diagram-model" }
ui-api = { path = "../crates/ui-api" }

# Pinned per ADR 008 (egui/eframe APIs are in flux — keep the GUI layer thin so churn
# never reaches the core). 0.37 is the version S-012 was built and tested against.
eframe = "0.37"

# FR13 (CR-005): application options persisted as JSON in the platform config dir.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[dev-dependencies]
# AC3 test: the `.txt` sink writes into a throwaway directory.
tempfile = "3"
# Headless screenshot rasterizer (gui_tests::visual_dump, opt-in via GUI_DUMP=1).
png = "0.17"

[lints]
workspace = true

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Web build (S-019): the `#[wasm_bindgen]` entry glue (`web.rs`) and the DOM file
# picker / localStorage persistence (`webio.rs`, `config.rs`). eframe brings its own
# wasm deps for the renderer; these are only what OUR code touches directly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = {
    version = "0.3",
    features = [
        "CssStyleDeclaration",
        "Document",
        "Element",
        "File",
        "FileList",
        "HtmlCanvasElement",
        "HtmlInputElement",
        "Storage",
        "Window",
    ],
}
