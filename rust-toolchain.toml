# The toolchain is pinned for reproducible builds — compiler, clippy, rustfmt behavior
# and the wasm32 target are all fixed. ADR 010 v4 no longer *requires* the pin (only
# `clippy::all` is enforced, no unstable nursery lints); it remains good practice.
# Bumping this file is a deliberate, reviewed change.
[toolchain]
channel = "1.99.1"
components = ["cargo", "clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
