# The toolchain is pinned for reproducible builds — compiler, clippy, rustfmt behavior
# and the wasm targets are all fixed. ADR 010 v4 no longer *requires* the pin (only
# `clippy::all` is enforced, no unstable nursery lints); it remains good practice.
# Bumping this file is a deliberate, reviewed change.
#
# Two wasm targets (S-019):
# - wasm32-unknown-unknown — the web bundle (Trunk/wasm-bindgen, eframe WebRunner).
# - wasm32-wasip1 — running the headless crates' test suites on wasm (QS4) via
#   `scripts/wasm-core-tests.mjs` (Node WASI host); needs real fs for goldens.
[toolchain]
channel = "1.99.1"
components = ["cargo", "clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
